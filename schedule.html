<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初回相談 日程選択</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue:   #4285F4;
    --green:  #344853;
    --yellow: #FBBC05;
    --red:    #EA4335;
    --white:  #FFFFFF;
    --bg:     #F6F8FA;
    --text:   #202124;
    --muted:  #5F6368;
    --border: #DADCE0;
  }

  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== ヘッダー ===== */
  .hero {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 40px 24px 36px;
    text-align: center;
  }
  .hero__badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--yellow);
    color: var(--text);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 18px;
  }
  .hero h1 {
    font-size: clamp(20px, 5vw, 26px);
    font-weight: 900;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 10px;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--blue);
  }
  .hero__sub {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.8;
  }

  /* ===== コンテナ ===== */
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px 64px;
  }

  /* ===== 日程カード ===== */
  .dates { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }

  .date-card {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 20px 20px 20px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: border-color .15s, background .15s, box-shadow .15s;
    user-select: none;
  }
  .date-card:hover {
    border-color: var(--blue);
    background: rgba(66,133,244,.03);
  }
  .date-card.selected {
    border-color: var(--blue);
    background: rgba(66,133,244,.06);
    box-shadow: 0 0 0 3px rgba(66,133,244,.15);
  }

  .date-radio {
    width: 22px; height: 22px;
    border: 2px solid var(--border);
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .date-card.selected .date-radio {
    background: var(--blue);
    border-color: var(--blue);
  }
  .date-radio::after {
    content: '';
    width: 8px; height: 8px;
    background: white;
    border-radius: 50%;
    display: none;
  }
  .date-card.selected .date-radio::after { display: block; }

  .date-info { flex: 1; }
  .date-main {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.4;
  }
  .date-card.selected .date-main { color: var(--blue); }
  .date-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 3px;
  }

  .date-badge {
    font-size: 11px;
    font-weight: 700;
    background: rgba(66,133,244,.1);
    color: var(--blue);
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }

  /* ===== ボタン ===== */
  .btn-submit {
    width: 100%;
    padding: 16px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: .04em;
    transition: background .15s, opacity .15s;
    box-shadow: 0 2px 8px rgba(66,133,244,.3);
  }
  .btn-submit:hover:not(:disabled) { background: #3367d6; }
  .btn-submit:disabled {
    background: var(--border);
    color: var(--muted);
    box-shadow: none;
    cursor: not-allowed;
  }

  /* ===== 確認画面 ===== */
  #confirm { display: none; }

  .confirm-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    text-align: center;
  }
  .confirm-band {
    height: 5px;
    background: var(--blue);
  }
  .confirm-body { padding: 36px 24px 32px; }

  .confirm-icon {
    width: 64px; height: 64px;
    background: rgba(66,133,244,.1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
  }
  .confirm-title {
    font-size: 20px;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 12px;
  }
  .confirm-date {
    font-size: 18px;
    font-weight: 800;
    color: var(--blue);
    background: rgba(66,133,244,.07);
    border-radius: 8px;
    padding: 12px 20px;
    margin: 0 auto 16px;
    display: inline-block;
  }
  .confirm-msg {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 28px;
  }
  .btn-back-link {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<!-- ★ここを毎回書き換える★ -->
<script>
const DATES = [
  { main: '7月8日（火）10:00〜11:00',  sub: 'オンライン（Zoom）', badge: '残り2枠' },
  { main: '7月10日（木）13:00〜14:00', sub: 'オンライン（Zoom）', badge: '残り1枠' },
  { main: '7月12日（土）10:00〜11:00', sub: 'オンライン（Zoom）', badge: '残り2枠' },
];
const CONTACT_NOTE = 'ご確認後、ZoomのURLをメールにてお送りします。';
</script>

<div class="hero">
  <div class="hero__badge">📅 日程選択</div>
  <h1>初回<em>オンライン相談</em><br>日程を選んでください</h1>
  <p class="hero__sub">無料・約30分。候補日から1つお選びください。</p>
</div>

<div class="container">

  <!-- 日程選択 -->
  <div id="selection">
    <div class="dates" id="date-list"></div>
    <button class="btn-submit" id="btn-submit" disabled onclick="showConfirm()">この日程で申し込む</button>
  </div>

  <!-- 確認画面 -->
  <div id="confirm">
    <div class="confirm-card">
      <div class="confirm-band"></div>
      <div class="confirm-body">
        <div class="confirm-icon">✅</div>
        <div class="confirm-title">ご予約を受け付けました</div>
        <div class="confirm-date" id="confirm-date"></div>
        <p class="confirm-msg" id="confirm-msg"></p>
        <button class="btn-back-link" onclick="reset()">別の日程を選び直す</button>
      </div>
    </div>
  </div>

</div>

<script>
let selected = null;

// 日程カードを生成
const list = document.getElementById('date-list');
DATES.forEach((d, i) => {
  const card = document.createElement('div');
  card.className = 'date-card';
  card.dataset.index = i;
  card.innerHTML = `
    <div class="date-radio"></div>
    <div class="date-info">
      <div class="date-main">${d.main}</div>
      <div class="date-sub">${d.sub}</div>
    </div>
    ${d.badge ? `<div class="date-badge">${d.badge}</div>` : ''}
  `;
  card.addEventListener('click', function() {
    document.querySelectorAll('.date-card').forEach(c => c.classList.remove('selected'));
    this.classList.add('selected');
    selected = DATES[this.dataset.index];
    document.getElementById('btn-submit').disabled = false;
  });
  list.appendChild(card);
});

function showConfirm() {
  if (!selected) return;
  document.getElementById('selection').style.display = 'none';
  document.getElementById('confirm').style.display = 'block';
  document.getElementById('confirm-date').textContent = selected.main;
  document.getElementById('confirm-msg').textContent = CONTACT_NOTE;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reset() {
  selected = null;
  document.querySelectorAll('.date-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('btn-submit').disabled = true;
  document.getElementById('selection').style.display = 'block';
  document.getElementById('confirm').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>

</body>
</html>
