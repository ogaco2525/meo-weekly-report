<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初回オンライン相談 日程選択</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue:   #4285F4;
    --yellow: #FBBC05;
    --red:    #EA4335;
    --white:  #FFFFFF;
    --bg:     #F6F8FA;
    --text:   #202124;
    --muted:  #5F6368;
    --border: #DADCE0;
  }
  body {
    font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* hero */
  .hero {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 40px 24px 36px;
    text-align: center;
  }
  .hero__badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--yellow); color: var(--text);
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    padding: 4px 12px; border-radius: 4px; margin-bottom: 18px;
  }
  .hero h1 {
    font-size: clamp(20px, 5vw, 26px); font-weight: 900;
    line-height: 1.55; margin-bottom: 10px;
  }
  .hero h1 em { font-style: normal; color: var(--blue); }
  .hero__sub { font-size: 13px; color: var(--muted); line-height: 1.8; }

  /* container */
  .container { max-width: 560px; margin: 0 auto; padding: 28px 16px 64px; }

  /* ステップ表示 */
  .step-label {
    font-size: 11px; font-weight: 700; color: var(--blue);
    letter-spacing: .1em; text-transform: uppercase;
    margin-bottom: 14px; display: block;
  }

  /* loading / error */
  .state-box {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 14px; padding: 40px 24px;
    text-align: center; color: var(--muted); font-size: 14px;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 日程カード */
  .dates { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .date-card {
    background: var(--white); border: 2px solid var(--border);
    border-radius: 14px; padding: 18px 18px 18px 16px;
    cursor: pointer; display: flex; align-items: center; gap: 14px;
    transition: border-color .15s, background .15s, box-shadow .15s;
    user-select: none;
  }
  .date-card:hover { border-color: var(--blue); background: rgba(66,133,244,.03); }
  .date-card.selected {
    border-color: var(--blue); background: rgba(66,133,244,.06);
    box-shadow: 0 0 0 3px rgba(66,133,244,.15);
  }
  .date-radio {
    width: 22px; height: 22px; border: 2px solid var(--border);
    border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .date-card.selected .date-radio { background: var(--blue); border-color: var(--blue); }
  .date-radio::after {
    content: ''; width: 8px; height: 8px;
    background: white; border-radius: 50%; display: none;
  }
  .date-card.selected .date-radio::after { display: block; }
  .date-info { flex: 1; }
  .date-main { font-size: 16px; font-weight: 800; line-height: 1.4; }
  .date-card.selected .date-main { color: var(--blue); }
  .date-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* フォーム */
  .form-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px 20px;
    margin-bottom: 20px;
  }
  .form-card h3 {
    font-size: 15px; font-weight: 800; margin-bottom: 18px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 12px; font-weight: 700;
    color: var(--muted); margin-bottom: 6px; letter-spacing: .04em;
  }
  .field label span { color: var(--red); margin-left: 2px; }
  .field input, .field textarea {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 8px;
    font-size: 15px; font-family: inherit; color: var(--text);
    background: var(--white); transition: border-color .15s;
    outline: none;
  }
  .field input:focus, .field textarea:focus { border-color: var(--blue); }
  .field textarea { resize: vertical; min-height: 80px; }
  .field input::placeholder, .field textarea::placeholder { color: var(--border); }

  /* 選択中の枠ラベル */
  .selected-slot-label {
    background: rgba(66,133,244,.08); border: 1.5px solid rgba(66,133,244,.3);
    border-radius: 8px; padding: 10px 14px;
    font-size: 14px; font-weight: 700; color: var(--blue);
    margin-bottom: 18px;
  }

  /* ボタン */
  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 800; cursor: pointer;
    letter-spacing: .04em; transition: background .15s, opacity .15s;
  }
  .btn-primary {
    background: var(--blue); color: white;
    box-shadow: 0 2px 8px rgba(66,133,244,.3);
  }
  .btn-primary:hover:not(:disabled) { background: #3367d6; }
  .btn-primary:disabled {
    background: var(--border); color: var(--muted);
    box-shadow: none; cursor: not-allowed;
  }
  .btn-back {
    background: none; color: var(--muted);
    border: 1.5px solid var(--border); margin-bottom: 12px;
    font-size: 14px;
  }
  .btn-back:hover { background: var(--bg); }

  /* 完了画面 */
  .confirm-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; text-align: center;
  }
  .confirm-band { height: 5px; background: var(--blue); }
  .confirm-body { padding: 36px 24px 32px; }
  .confirm-icon {
    width: 64px; height: 64px; background: rgba(66,133,244,.1);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 28px;
  }
  .confirm-title { font-size: 20px; font-weight: 900; margin-bottom: 12px; }
  .confirm-date {
    font-size: 17px; font-weight: 800; color: var(--blue);
    background: rgba(66,133,244,.07); border-radius: 8px;
    padding: 12px 20px; display: inline-block; margin-bottom: 10px;
  }
  .confirm-name { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .confirm-msg { font-size: 13px; color: var(--muted); line-height: 1.8; margin-bottom: 24px; }
  .btn-back-link {
    font-size: 13px; color: var(--muted); background: none;
    border: none; cursor: pointer; text-decoration: underline;
  }

  /* エラーメッセージ */
  .error-msg {
    background: rgba(234,67,53,.08); border: 1px solid rgba(234,67,53,.3);
    border-radius: 8px; padding: 12px 14px;
    font-size: 13px; color: var(--red); margin-bottom: 14px; display: none;
  }

  /* ページ切替 */
  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>

<script>
// ============================================================
// ★ Apps Script をデプロイしたら、URLをここに貼る
// ============================================================
const APPS_SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL_HERE';
// ============================================================
</script>

<div class="hero">
  <div class="hero__badge">📅 日程選択</div>
  <h1>初回<em>オンライン相談</em><br>日程を選んでください</h1>
  <p class="hero__sub">無料・約60分。Googleカレンダーの空き枠から選べます。</p>
</div>

<div class="container">

  <!-- STEP 1: 日程選択 -->
  <div id="page-slots" class="page active">
    <span class="step-label">STEP 1 / 2 — 日程を選ぶ</span>
    <div id="slots-loading" class="state-box">
      <div class="spinner"></div>
      空き枠を読み込んでいます…
    </div>
    <div id="slots-error" class="state-box" style="display:none; color: var(--red);">
      空き枠の取得に失敗しました。<br>ページを再読み込みしてください。
    </div>
    <div class="dates" id="date-list" style="display:none;"></div>
    <button class="btn btn-primary" id="btn-next" disabled style="display:none;" onclick="goToForm()">
      次へ → 情報を入力する
    </button>
  </div>

  <!-- STEP 2: フォーム -->
  <div id="page-form" class="page">
    <span class="step-label">STEP 2 / 2 — お名前・連絡先</span>
    <div class="form-card">
      <h3>選んだ日程</h3>
      <div class="selected-slot-label" id="form-slot-label"></div>
      <div class="field">
        <label>お名前<span>*</span></label>
        <input type="text" id="f-name" placeholder="例：山田 花子" autocomplete="name">
      </div>
      <div class="field">
        <label>電話番号<span>*</span></label>
        <input type="tel" id="f-phone" placeholder="例：090-0000-0000" autocomplete="tel">
      </div>
      <div class="field">
        <label>備考（任意）</label>
        <textarea id="f-note" placeholder="お店の業種・気になっていること など、なんでも"></textarea>
      </div>
    </div>
    <div class="error-msg" id="form-error"></div>
    <button class="btn btn-back" onclick="goToSlots()">← 日程を選び直す</button>
    <button class="btn btn-primary" id="btn-submit" onclick="submitForm()">予約を確定する</button>
  </div>

  <!-- 完了 -->
  <div id="page-done" class="page">
    <div class="confirm-card">
      <div class="confirm-band"></div>
      <div class="confirm-body">
        <div class="confirm-icon">✅</div>
        <div class="confirm-title">ご予約ありがとうございます</div>
        <div class="confirm-date" id="done-slot"></div>
        <p class="confirm-name" id="done-name"></p>
        <p class="confirm-msg">
          ご確認後、ZoomのURLをご連絡いたします。<br>
          当日はどうぞよろしくお願いいたします。
        </p>
        <button class="btn-back-link" onclick="restart()">最初からやり直す</button>
      </div>
    </div>
  </div>

</div>

<script>
let slots = [];
let selectedSlot = null;

// ==============================
// ページ初期化: 空き枠取得
// ==============================
async function loadSlots() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    slots = data.slots || [];

    document.getElementById('slots-loading').style.display = 'none';

    if (slots.length === 0) {
      document.getElementById('slots-error').style.display = 'block';
      document.getElementById('slots-error').textContent = '現在ご案内できる空き枠がありません。しばらくしてから再度お試しください。';
      return;
    }

    const list = document.getElementById('date-list');
    list.style.display = 'flex';
    document.getElementById('btn-next').style.display = 'block';

    slots.forEach((slot, i) => {
      const card = document.createElement('div');
      card.className = 'date-card';
      card.dataset.index = i;
      card.innerHTML = `
        <div class="date-radio"></div>
        <div class="date-info">
          <div class="date-main">${slot.label}〜${slot.endLabel}</div>
          <div class="date-sub">オンライン（Zoom）</div>
        </div>
      `;
      card.addEventListener('click', function() {
        document.querySelectorAll('.date-card').forEach(c => c.classList.remove('selected'));
        this.classList.add('selected');
        selectedSlot = slots[this.dataset.index];
        document.getElementById('btn-next').disabled = false;
      });
      list.appendChild(card);
    });
  } catch (e) {
    document.getElementById('slots-loading').style.display = 'none';
    document.getElementById('slots-error').style.display = 'block';
  }
}

// ==============================
// ページ切替
// ==============================
function goToForm() {
  if (!selectedSlot) return;
  document.getElementById('form-slot-label').textContent =
    `${selectedSlot.label}〜${selectedSlot.endLabel}`;
  showPage('page-form');
}
function goToSlots() { showPage('page-slots'); }
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==============================
// 送信
// ==============================
async function submitForm() {
  const name  = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const note  = document.getElementById('f-note').value.trim();
  const errEl = document.getElementById('form-error');
  errEl.style.display = 'none';

  if (!name || !phone) {
    errEl.textContent = 'お名前と電話番号は必須です。';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '送信中…';

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: selectedSlot.start, name, phone, note }),
    });
    const data = await res.json();

    if (data.ok) {
      document.getElementById('done-slot').textContent =
        `${selectedSlot.label}〜${selectedSlot.endLabel}`;
      document.getElementById('done-name').textContent = `${name} 様`;
      showPage('page-done');
    } else {
      errEl.textContent = data.error || '送信に失敗しました。もう一度お試しください。';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '予約を確定する';
    }
  } catch (e) {
    errEl.textContent = '通信エラーが発生しました。もう一度お試しください。';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = '予約を確定する';
  }
}

function restart() {
  selectedSlot = null;
  document.getElementById('f-name').value = '';
  document.getElementById('f-phone').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('btn-next').disabled = true;
  document.querySelectorAll('.date-card').forEach(c => c.classList.remove('selected'));
  showPage('page-slots');
}

// 起動
loadSlots();
</script>

</body>
</html>
